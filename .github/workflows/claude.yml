name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  # Reponse aux mentions @claude dans les commentaires
  claude-comment:
    if: |
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: "--max-turns 25"

  # Revue automatique sur les nouvelles PRs
  claude-review:
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'ready_for_review' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: "/review"
          claude_args: "--max-turns 10 --model sonnet"

  # Triage automatique des nouvelles issues
  claude-triage:
    if: |
      github.event_name == 'issues' &&
      github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Analyse cette issue et fournis :
            1. Un resume en une phrase
            2. Une classification : bug, feature, docs, question, enhancement
            3. Une estimation de complexite : S, M, L, XL
            4. Les fichiers probablement concernes (base sur le titre et la description)
            5. Des questions de clarification si l'issue est ambigue

            Reponds en francais. Sois concis et actionnable.
          claude_args: "--max-turns 5 --model sonnet"
